# EVER: deploy the Cloudflare Worker (rooms + world bot) with wrangler.
# Off until the repository variable EVER_DEPLOY_WORKER is "true" and the secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist (docs/PLATFORM.md 5).
# The static site deploys through Cloudflare Pages' git integration, not here.
# Copyright (C) 2026 the EVER contributors. SPDX-License-Identifier: AGPL-3.0-or-later
name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - server/**
      - game/src/core/contracts.js
      - game/src/core/rules/**
      - game/src/combat/rules/**
      - game/src/mechanics/**
      - game/src/platform/**
      - vendor/slaytheweb/**
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.EVER_DEPLOY_WORKER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config server/wrangler.toml
